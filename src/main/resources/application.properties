# Configuración del Servidor
server.port=8080
spring.application.name=turismap-admin
# Public app handoff URLs. Set store URLs only when a valid installer/store listing exists.
turismap.app.deep-link-url=${TURISMAP_APP_DEEP_LINK_URL:turismap://planes_comercio}
turismap.app.android-download-url=${TURISMAP_ANDROID_DOWNLOAD_URL:}
turismap.app.ios-download-url=${TURISMAP_IOS_DOWNLOAD_URL:}

# Configuración de Firebase (Cloud Firestore)
firebase.credentials.file=turismap-2026-firebase-adminsdk-fbsvc-0ea58c0cf2.json
firebase.project.id=turismap-2026
firebase.storage.bucket=turismap-2026.appspot.com

# Configuración JWT
jwt.secret=turismap-secret-key-2026-spring-boot-firebase-integration
jwt.expiration=86400000

# Configuración de Logging
logging.level.com.turismap.admin=DEBUG
logging.level.org.springframework.security=DEBUG

# Configuración de Archivos Estáticos
spring.web.resources.static-locations=classpath:/static/

# Configuración de Carga Máxima de Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
