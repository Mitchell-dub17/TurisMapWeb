<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - TurisMap El Salvador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00D166;
            --primary-hover: #00B758;
            --dark: #0B0F19;
            --bg-body: #070A10;
            --bg-card: #131B2E;
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background-image: radial-gradient(circle at 50% 10%, rgba(0, 209, 102, 0.08) 0%, transparent 60%);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #FFF;
            font-size: 24px;
            font-weight: 800;
        }

        .auth-logo span { color: var(--primary); }

        .plan-notice {
            background: rgba(0, 209, 102, 0.12);
            border: 1px solid rgba(0, 209, 102, 0.3);
            border-radius: 12px;
            padding: 12px 18px;
            max-width: 460px;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

        .plan-notice strong { color: var(--primary); }

        #errorMsg {
            background: rgba(255, 56, 92, 0.15);
            border: 1px solid #FF385C;
            color: #FF5A78;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            display: none;
            font-weight: 600;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 460px;
            width: 100%;
            padding: 32px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 26px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13.5px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #0B0F19;
            box-shadow: 0 4px 12px rgba(0, 209, 102, 0.3);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #CBD5E1;
        }

        .form-group input {
            background: #0B0F19;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: #FFFFFF;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus { border-color: var(--primary); }

        /* ==========================================================
           CONTENEDOR DEL PASSWORD CON "OJITO"
           ========================================================== */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 44px !important;
        }

        .btn-toggle-eye {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s, transform 0.15s;
            user-select: none;
        }

        .btn-toggle-eye:hover {
            color: var(--primary);
            transform: scale(1.15);
        }

        .input-phone {
            display: flex;
            align-items: center;
            background: #0B0F19;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .input-phone:focus-within { border-color: var(--primary); }

        .phone-tag {
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid var(--border);
        }

        .input-phone input {
            border: none !important;
            width: 100%;
        }

        .btn-submit {
            background: var(--primary);
            color: #0B0F19;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .back-link:hover { color: #FFF; }
    </style>
</head>
<body>

<header class="auth-header">
    <a th:href="@{/}" class="auth-logo">
        📍 Turis<span>Map</span>
    </a>
</header>

<!-- BANNER DE PLAN SELECCIONADO -->
<div class="plan-notice" id="plan-notice" style="display: none;">
    <span>🎯</span>
    <div>
        Estás a un paso de solicitar el <strong id="notice-plan-name">Plan</strong>. Regístrate o ingresa a tu cuenta para continuar.
    </div>
</div>

<!-- BANNER DINÁMICO DE ERRORES -->
<div id="errorMsg"></div>

<main class="auth-card">
    <div class="auth-tabs">
        <button type="button" class="tab-btn active" id="tab-login" onclick="cambiarPestaña('login')">Iniciar Sesión</button>
        <button type="button" class="tab-btn" id="tab-register" onclick="cambiarPestaña('register')">Crear Cuenta</button>
    </div>

    <!-- 1. FORMULARIO DE LOGIN -->
    <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email">
        </div>

        <!-- CONTRASEÑA LOGIN CON OJITO -->
        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('password', this)" tabindex="-1" aria-label="Ver u ocultar contraseña">
                    <!-- Ojo abierto -->
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <!-- Ojo cerrado -->
                    <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnLoginSubmit">Ingresar a TurisMap</button>

        <p class="form-footer">
            ¿No tienes cuenta? <a href="javascript:void(0)" onclick="cambiarPestaña('register')">Regístrate aquí</a>
        </p>
    </form>

    <!-- 2. FORMULARIO DE REGISTRO -->
    <form class="auth-form" id="registerForm" style="display: none;" novalidate>
        <input type="hidden" id="register-plan-input" value="NINGUNO">

        <div class="form-group">
            <label for="regNombre">Nombre Completo *</label>
            <input type="text" id="regNombre" placeholder="Ej. Diego Zepeda" required>
        </div>

        <div class="form-group">
            <label for="regEmail">Correo Electrónico *</label>
            <input type="email" id="regEmail" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
            <label for="regTelefono">WhatsApp / Teléfono *</label>
            <div class="input-phone">
                <span class="phone-tag">🇸🇻 +503</span>
                <input type="tel" id="regTelefono" placeholder="7123-4567" maxlength="9" required>
            </div>
        </div>

        <!-- CONTRASEÑA REGISTRO CON OJITO -->
        <div class="form-group">
            <label for="regPassword">Contraseña *</label>
            <div class="password-wrapper">
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
                <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('regPassword', this)" tabindex="-1" aria-label="Ver u ocultar contraseña">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>
        </div>

        <!-- CONFIRMAR CONTRASEÑA CON OJITO -->
        <div class="form-group">
            <label for="regPasswordConfirm">Confirmar Contraseña *</label>
            <div class="password-wrapper">
                <input type="password" id="regPasswordConfirm" placeholder="Repite tu contraseña" required>
                <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('regPasswordConfirm', this)" tabindex="-1" aria-label="Ver u ocultar contraseña">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnRegisterSubmit">Crear Cuenta</button>

        <p class="form-footer">
            ¿Ya tienes cuenta? <a href="javascript:void(0)" onclick="cambiarPestaña('login')">Inicia sesión</a>
        </p>
    </form>
</main>

<a th:href="@{/}" class="back-link">← Volver al inicio de TurisMap</a>

<script>
    // Función global para alternar visibilidad de contraseña con el ojito
    window.togglePasswordVisibility = function(inputId, btn) {
        const input = document.getElementById(inputId);
        if (!input) return;

        const esPassword = input.type === 'password';
        input.type = esPassword ? 'text' : 'password';

        const eyeOpen = btn.querySelector('.eye-open');
        const eyeClosed = btn.querySelector('.eye-closed');

        if (eyeOpen && eyeClosed) {
            eyeOpen.style.display = esPassword ? 'none' : 'block';
            eyeClosed.style.display = esPassword ? 'block' : 'none';
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const planParam = urlParams.get('plan');
        const tabParam = urlParams.get('tab');

        if (planParam) {
            document.getElementById('plan-notice').style.display = 'flex';
            document.getElementById('notice-plan-name').textContent = planParam;
            document.getElementById('register-plan-input').value = planParam;
        }

        if (tabParam === 'register') {
            cambiarPestaña('register');
        }

        const inputPhone = document.getElementById('regTelefono');
        if (inputPhone) {
            inputPhone.addEventListener('input', (e) => {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 8) val = val.substring(0, 8);
                if (val.length > 4) {
                    e.target.value = val.substring(0, 4) + '-' + val.substring(4);
                } else {
                    e.target.value = val;
                }
            });
        }
    });
</script>

<!-- CARGA DE AUTH.JS CON CONTROL DE CACHÉ -->
<script type="module" th:src="@{/js/auth.js(v=3)}"></script>
</body>
</html>
