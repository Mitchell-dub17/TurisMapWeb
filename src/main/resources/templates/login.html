<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurisMap - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-container">
        <div class="brand-icon">🗺️</div>
        <h1>Bienvenido a TurisMap</h1>
        <p>Ingresa tus datos para acceder a tu panel.</p>

        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Ingresar al Sistema</button>
            <div id="errorMsg" class="error-msg">❌ Correo o contraseña incorrectos.</div>
        </form>
    </div>

    <!-- Lógica de Autenticación Externa -->
    <script type="module" th:src="@{/js/auth.js}"></script>
</body>
</html>
